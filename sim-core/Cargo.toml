[package]
name = "sim-core"
version.workspace = true
edition.workspace = true

# This crate is a pure library: no I/O, no wasm-bindgen, no platform transcendentals.
# `tests/invariants.rs` enforces that mechanically: determinism (spec §7.4), and no I/O
# or static mutable state (spec §7.2).
[dependencies]
glam.workspace = true
libm.workspace = true
# Deterministic binary serde for checkpoints: little-endian float bits, no maps.
postcard.workspace = true
rand.workspace = true
rand_pcg.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json = "1"
proptest = "1"
ts-rs.workspace = true
