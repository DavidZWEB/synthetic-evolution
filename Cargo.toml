[workspace]
# Resolver 3 rather than 2: it is the edition-2024 default and is MSRV-aware, so a
# dependency bump cannot silently pull in something newer than the pinned toolchain.
resolver = "3"
members = ["sim-core", "shells/native", "shells/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# Declared once here; member crates write `glam.workspace = true`. The native and
# wasm shells cannot drift onto different versions of a shared dependency.
[workspace.dependencies]
sim-core = { path = "sim-core" }

# All three features are load-bearing determinism choices, not tidiness (spec §7.4).
#
# `default-features = false` disables glam's `std` math and `libm` routes its
# transcendentals through software implementations instead: platform sin/cos differ
# between native and WASM, which is a silent determinism break.
#
# `scalar-math` disables glam's SIMD backends. It is the one that is easy to lose,
# because dropping it breaks nothing that any single machine can see: glam picks SSE2
# on x86_64 and scalar elsewhere, so a quaternion op gives one answer on an x86_64
# runner and another on an aarch64 laptop, from the same seed. WASM is scalar too,
# which means the native-versus-WASM cross-target test agrees on an aarch64 machine
# and hides it. It does not affect Vec3's 12-byte layout that `agents.rs` asserts
# (spec §7.3) — Vec3 is scalar with or without it, which is why that assert never
# caught this.
glam = { version = "0.30", default-features = false, features = ["libm", "scalar-math", "serde"] }
libm = "0.2"
rand = { version = "0.9", default-features = false }
# `serde` so RNG state can be checkpointed and resumed mid-run.
rand_pcg = { version = "0.9", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Cargo ignores this for test targets, so `cargo test --release` still works.
panic = "abort"
