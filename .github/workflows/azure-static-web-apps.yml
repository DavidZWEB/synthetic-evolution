# Deploys web/ to Azure Static Web Apps.
#
# The build happens here rather than in Azure's Oryx container: the client imports
# wasm-pack output from web/src/wasm/, which is gitignored (docs/development.md) and
# needs a Rust toolchain Oryx does not have. So this job builds the wasm and the
# client here and hands the action a finished dist/ with skip_app_build.
#
# It does not run the tests itself. Production deploys are triggered by ci.yml
# finishing, and only when it succeeded, so main can only reach the live site on a
# commit whose suite passed. Pull requests build in CI but do not deploy; the closed
# event remains temporarily so previews created by older workflow revisions are removed.
#
# One consequence of workflow_run worth knowing before editing this file: GitHub
# always runs the copy of it that is on the default branch. Changes to the production
# path here do nothing until they are merged, and cannot be exercised from a branch.
name: Azure Static Web Apps

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

# A second push to the same branch makes the first deploy irrelevant.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    # A CI run that failed, was cancelled, or was skipped is not a green light.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      # A workflow_run event carries the default branch's ref, not the commit that
      # was tested, so the tested SHA has to be named explicitly. Deploying
      # github.ref here would ship whatever main happens to be at now, which is not
      # necessarily what CI just passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Before setup.sh, and load-bearing for more than build times: rust-cache
      # restores $CARGO_HOME/bin, so setup.sh finds the pinned wasm-pack already
      # present and skips a from-source `cargo install` that costs minutes.
      - uses: Swatinem/rust-cache@v2

      # scripts/setup.sh is the single source of truth for what a working checkout
      # needs: the pinned toolchain from rust-toolchain.toml, the pinned wasm-pack,
      # and npm ci. Browser automation is not part of deployment, and ci.yml has
      # already run the suite on this commit before this workflow is triggered.
      - name: Set up toolchains and install dependencies
        run: ./scripts/setup.sh --skip-tests --skip-browser

      # The build script generates the gitignored wasm bindings before invoking Vite,
      # matching the clean-checkout path developers use.
      - name: Build wasm and client
        run: npm run build --prefix web

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # When skip_app_build is true, this action zips and uploads app_location
          # verbatim — it does NOT combine it with output_location, despite
          # output_location being accepted as an input. Pointing app_location at
          # web/ (the source) deployed the unbuilt index.html referencing
          # /src/main.js, which the browser can't resolve: a blank screen with no
          # build error anywhere. app_location must be the built output itself.
          app_location: web/dist
          # No Azure Functions backend; the sim runs entirely in the browser.
          api_location: ""
          # dist/ is already built above. Letting Oryx rebuild would fail on the
          # missing Rust toolchain.
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      # Tears down previews created before PR deployment was disabled. No checkout or
      # build is needed, and this job can be removed once those previews are gone.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: web
