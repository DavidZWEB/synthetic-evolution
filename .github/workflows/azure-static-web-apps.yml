# Deploys web/ to Azure Static Web Apps.
#
# The build happens here rather than in Azure's Oryx container: the client imports
# wasm-pack output from web/src/wasm/, which is gitignored (docs/development.md) and
# needs a Rust toolchain Oryx does not have. So this job runs the same setup a
# developer runs, builds the wasm, builds the client, and hands the action a finished
# dist/ with skip_app_build.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# A second push to the same branch makes the first deploy irrelevant.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # The action reads the PR head commit to label preview environments.
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Restores the cargo registry and target/ across runs. Without it every deploy
      # rebuilds the whole workspace, including wasm-pack's own dependencies.
      - uses: Swatinem/rust-cache@v2

      # scripts/setup.sh is the single source of truth for what a working checkout
      # needs: it reads rust-toolchain.toml, installs the pinned wasm-pack, runs
      # `npm ci`, and finishes with `cargo test --workspace`. Calling it here rather
      # than restating its steps means the deploy cannot drift from local setup, and
      # nothing reaches the site that the test suite has not passed.
      - name: Set up toolchains, install dependencies, run tests
        run: ./scripts/setup.sh

      - name: Build wasm bindings
        run: npm run wasm --prefix web

      - name: Build client
        run: npm run build --prefix web

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Vite's project root, and its build output relative to that root.
          app_location: web
          output_location: dist
          # No Azure Functions backend; the sim runs entirely in the browser.
          api_location: ""
          # dist/ is already built above. Letting Oryx rebuild would fail on the
          # missing Rust toolchain.
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      # Tears down the per-PR preview site. No checkout or build needed.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: web
