# Deploys web/ to Azure Static Web Apps.
#
# The build happens here rather than in Azure's Oryx container: the client imports
# wasm-pack output from web/src/wasm/, which is gitignored (docs/development.md) and
# needs a Rust toolchain Oryx does not have. So this job builds the wasm and the
# client here and hands the action a finished dist/ with skip_app_build.
#
# It does not run the tests: ci.yml covers this commit. The two workflows trigger
# together on a push to main rather than in sequence, so a deploy is concurrent with
# its verification, not gated on it.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# A second push to the same branch makes the first deploy irrelevant.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# repo_token below is used only to comment the preview URL on the pull request.
# Spelled out because a repository whose default workflow permissions are read-only
# drops that comment with no error.
permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The steps below are scripts/setup.sh without its `cargo test --workspace`
      # tail. ci.yml runs the suite on this same commit, so calling setup.sh here
      # would build and run all 13 test binaries a second time to learn nothing new.
      # See docs/development.md.

      # Reads rust-toolchain.toml and installs the pinned compiler, its components,
      # and the wasm target. Before the cache step: rust-cache keys on the rustc
      # version, so the pinned toolchain has to be the one it sees.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Read rather than repeated, because cargo-installed binaries are not covered
      # by Cargo.lock and scripts/setup.sh is where that version is pinned. A rename
      # there leaves this empty and the install fails loudly rather than silently
      # fetching whatever is latest.
      - name: Read the pinned wasm-pack version
        run: |
          version="$(sed -n 's/^WASM_PACK_VERSION="\(.*\)"$/\1/p' scripts/setup.sh)"
          test -n "$version" || { echo "no WASM_PACK_VERSION in scripts/setup.sh" >&2; exit 1; }
          echo "WASM_PACK_VERSION=$version" >> "$GITHUB_ENV"

      # Fetches a prebuilt binary. `cargo install` builds wasm-pack from source, which
      # costs more than the test run this job just stopped duplicating.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Install client dependencies
        run: npm ci --prefix web

      - name: Build wasm bindings
        run: npm run wasm --prefix web

      - name: Build client
        run: npm run build --prefix web

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Vite's project root, and its build output relative to that root.
          app_location: web
          output_location: dist
          # No Azure Functions backend; the sim runs entirely in the browser.
          api_location: ""
          # dist/ is already built above. Letting Oryx rebuild would fail on the
          # missing Rust toolchain.
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      # Tears down the per-PR preview site. No checkout or build needed.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: web
