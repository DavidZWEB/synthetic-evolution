# Runs the test suite on every push. Separate from the deploy workflow on purpose:
# a golden-hash break should report as "CI failed", not as "Azure deploy failed",
# and the suite should not need a deployment token to run. See docs/development.md.
name: CI

on:
  push:
  pull_request:

# A newer commit on the same branch makes the older run's answer uninteresting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # `push` already covers every branch in this repository, so the pull_request
    # trigger exists only for forks, whose pushes are not visible here. Without this
    # guard each branch would build twice for the same commit.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml and installs the pinned compiler, its components,
      # and the wasm target. Deliberately before the cache step: rust-cache keys on
      # the rustc version, so the pinned toolchain has to be the one it sees.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./web/package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Browser binaries are cached, but each fresh Linux runner still needs the
      # system libraries installed by Playwright's --with-deps setup.
      - name: Install project toolchains and dependencies
        run: ./scripts/setup.sh --skip-tests --with-browser

      - name: Format
        run: cargo fmt --all --check

      # -D warnings because a lint nobody is required to fix is a lint nobody fixes.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The golden hash, energy conservation, the no-alloc check, and the source scan
      # for the determinism invariants all live in here.
      - name: Test
        run: cargo test --workspace

      - name: Test web transport
        run: npm test --prefix web

      - name: Check generated web types
        run: |
          npm run types --prefix web
          npm run check --prefix web
          git diff --exit-code -- web/src/generated

      - name: Test WASM boundary and determinism
        run: wasm-pack test --node shells/wasm

      # Pull requests are not deployed, so CI owns proving the complete browser bundle
      # can be produced from a clean checkout.
      - name: Build web client
        run: npm run build --prefix web

      - name: Test browser layout and paused inspection
        run: npm run test:browser --prefix web

      # sim-core reaching for something that is not in wasm's std would otherwise not
      # surface until a deploy. Checking the target is cheap; it is not a substitute
      # for running the tests under wasm, which needs the cross-target hash harness.
      - name: Check wasm target
        run: cargo check -p wasm --target wasm32-unknown-unknown
